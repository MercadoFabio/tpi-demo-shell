<header class="topbar">
  <a class="brand" routerLink="/dashboard">TPI · Shell App</a>
  <span class="badge">Angular 22</span>
  @if (session(); as authenticatedSession) {
    <span class="session-user">{{ authenticatedSession.email }}</span>
    <button type="button" [class]="buttonClass('secondary')" (click)="logout()">Cerrar sesión</button>
  }
</header>

<div class="layout">
  <nav aria-label="Navegación principal" class="sidebar">
    <a routerLink="/dashboard" routerLinkActive="active">Dashboard</a>
    <a routerLink="/usuarios" routerLinkActive="active">Usuarios</a>
    <a routerLink="/productos" routerLinkActive="active">Productos</a>
  </nav>

  <main>
    @if (!session()) {
      <form [class]="cardClass" class="login-card" (ngSubmit)="login()">
        <h1>Iniciar sesión</h1>
        <p>El BFF mantiene la sesión en una cookie HttpOnly; el navegador no guarda tokens.</p>
        <label for="email">Correo</label>
        <input id="email" [class]="fieldClass" name="email" type="email" autocomplete="username" [(ngModel)]="email" required>
        <label for="password">Contraseña</label>
        <input id="password" [class]="fieldClass" name="password" type="password" autocomplete="current-password" [(ngModel)]="password" minlength="12" required>
        @if (errorMessage) {
          <p class="form-error" aria-live="polite">{{ errorMessage }}</p>
        }
        <button type="submit" [class]="buttonClass('primary')">Ingresar</button>
      </form>
    }
    <router-outlet />
  </main>
</div>
