name: Integrar librerias en Shell

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  packages: read

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.SHELL_DISPATCH_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@mercadofabio'
      - run: npm install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.SHELL_DISPATCH_TOKEN }}
      - run: npm run build
